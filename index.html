<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="A quiet nocturnal memorial honoring those whose names should not be forgotten.">
  <title>Say Their Names</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('stn-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Subtle architectural projection frame -->
  <div class="gallery-frame" aria-hidden="true">
    <span class="gallery-corner gallery-corner--tl"></span>
    <span class="gallery-corner gallery-corner--tr"></span>
    <span class="gallery-corner gallery-corner--bl"></span>
    <span class="gallery-corner gallery-corner--br"></span>
  </div>

  <header class="site-chrome site-chrome--top">
    <button
      type="button"
      id="theme-toggle"
      class="icon-btn"
      aria-label="Switch to light theme"
      title="Switch to light theme"
    >
      <svg class="icon icon--sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2.5v2.2M12 19.3v2.2M4.93 4.93l1.55 1.55M17.52 17.52l1.55 1.55M2.5 12h2.2M19.3 12h2.2M6.48 17.52l-1.55 1.55M19.07 4.93l-1.55 1.55"></path>
      </svg>
      <svg class="icon icon--moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </header>

  <main class="stage" id="stage" aria-label="Memorial name display">
    <div class="name-presence" id="name-presence" data-phase="hidden">
      <h1 class="name-display" id="name-display" aria-live="polite" aria-atomic="true"></h1>

      <div class="indicator-slot">
        <span class="indicator-stem" aria-hidden="true"></span>
        <button
          type="button"
          id="context-trigger"
          class="context-trigger"
          aria-haspopup="dialog"
          aria-controls="context-dialog"
          aria-label="Read full context"
          disabled
        >
          <span class="context-trigger__mark" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square">
              <line x1="8" y1="2" x2="8" y2="14"></line>
              <line x1="2" y1="8" x2="14" y2="8"></line>
            </svg>
          </span>
          <span class="context-trigger__label">Context</span>
        </button>
      </div>
    </div>

    <noscript>
      <section class="noscript-memorial" aria-label="Memorial archive">
        <p class="noscript-note">JavaScript is disabled. Below are all names honored here and their context.</p>
        <ul class="noscript-list">
          <li>
            <details>
              <summary>Hind Rajab</summary>
              <p>A 5-year-old Palestinian girl killed in Gaza City in January 2024 after being trapped in a car under fire and making a widely publicized, hours-long emergency call to the Palestinian Red Crescent. She was honored by Houston Texans linebacker Azeez Al-Shaair on his eye black in September 2026.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Fatima Al-Bayook</summary>
              <p>An 8-year-old Palestinian girl who survived an earlier airstrike that killed her family in 2023 before later being killed in Gaza. She was honored by Houston Texans linebacker Azeez Al-Shaair on his eye black in October 2026.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Khaled Nabhan</summary>
              <p>A Palestinian grandfather known internationally as the &ldquo;soul of my soul&rdquo; grandfather after footage of him mourning his 3-year-old granddaughter Reem&mdash;killed in an Israeli attack in November 2023&mdash;went viral. Khaled Nabhan himself was killed in an Israeli strike in December 2024.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Reem Nabhan</summary>
              <p>The 3-year-old granddaughter of Khaled Nabhan, killed in an Israeli attack in November 2023. Footage of her grandfather mourning her as the &ldquo;soul of my soul&rdquo; reached audiences worldwide; Khaled Nabhan was later killed in an Israeli strike in December 2024.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Refaat Alareer</summary>
              <p>A 44-year-old Palestinian poet, writer, and professor of English literature at the Islamic University of Gaza, best known for his poem <em>&ldquo;If I must die.&rdquo;</em> He was killed in an Israeli airstrike in Gaza City on December 6, 2023, alongside several members of his family.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Sha&rsquo;ban al-Dalou</summary>
              <p>A 19-year-old software engineering student who burned to death on October 14, 2024, after an Israeli strike hit a tent encampment at Shuhada al-Aqsa Hospital in Deir al-Balah. His mother and two younger siblings also died from the attack.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Hamza Al-Dahdouh</summary>
              <p>An Al Jazeera journalist and the son of Al Jazeera&rsquo;s Gaza bureau chief Wael Al-Dahdouh. He was killed in an Israeli airstrike in southern Gaza on January 7, 2024, alongside freelance journalist Mustafa Thuria, becoming the fifth member of Wael Al-Dahdouh&rsquo;s immediate family killed during the war.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Mustafa Thuria</summary>
              <p>A freelance journalist killed in an Israeli airstrike in southern Gaza on January 7, 2024, alongside Al Jazeera journalist Hamza Al-Dahdouh.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Ren&eacute;e Nicole Good</summary>
              <p>A U.S. citizen and mother shot and killed by a masked ICE agent in Minneapolis on January 7, 2026, while behind the wheel of her vehicle. Agents claimed she attempted to ram them, while eyewitness accounts and video footage sparked nationwide protests and calls for a federal investigation.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Keith Porter Jr.</summary>
              <p>A 43-year-old U.S. citizen and father of two shot and killed by an off-duty ICE agent outside his home in Northridge, Los Angeles, on New Year&rsquo;s Eve 2025. The agent alleged Porter fired at him, while Porter&rsquo;s family stated he was firing celebratory shots and posed no threat.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Silverio Villegas Gonz&aacute;lez</summary>
              <p>A 38-year-old Mexican national, cook, and father of two shot and killed by an ICE agent during a traffic stop in the Chicago suburb of Franklin Park on September 12, 2025. DHS claimed he hit and dragged an officer with his car, though video analysis by <em>The New York Times</em> and footage obtained by the <em>Chicago Sun-Times</em> contradicted the agency&rsquo;s account.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Lorenzo Salgado Araujo</summary>
              <p>A Mexican national shot and killed by ICE agents after a traffic stop; ICE alleged he tried to ram agents with his car, a claim contradicted by three witnesses.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Joan Sebastian Guerrero</summary>
              <p>A 26-year-old Colombian national shot and killed by an ICE agent on July 10, 2026, with ICE stating the agent opened fire as Guerrero attempted to drive away.</p>
            </details>
          </li>
          <li>
            <details>
              <summary>Mr. Lunas Campos</summary>
              <p>Died in ICE custody at Camp East Montana in El Paso, Texas, in January 2026. ICE initially cited a medical emergency, but the El Paso County Medical Examiner ruled his death a homicide resulting from asphyxia due to neck and torso compression. The American Immigration Lawyers Association (AILA) maintains a public log of all reported ICE custody deaths.</p>
            </details>
          </li>
        </ul>
      </section>
    </noscript>
  </main>

  <footer class="site-chrome site-chrome--bottom">
    <button
      type="button"
      id="playback-toggle"
      class="playback-btn"
      aria-pressed="false"
      aria-label="Pause name display"
    >
      <svg class="icon icon--pause" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true">
        <line x1="8" y1="5" x2="8" y2="19"></line>
        <line x1="16" y1="5" x2="16" y2="19"></line>
      </svg>
      <svg class="icon icon--play" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
        <polygon points="7 5 19 12 7 19 7 5"></polygon>
      </svg>
      <span id="playback-label">Pause</span>
    </button>
  </footer>

  <dialog
    id="context-dialog"
    class="context-dialog"
    aria-labelledby="dialog-name"
    aria-describedby="dialog-body"
  >
    <article class="dialog-dossier">
      <div class="dialog-topbar">
        <div class="dialog-meta" id="dialog-meta"></div>
        <button
          type="button"
          id="dialog-close-x"
          class="icon-btn icon-btn--dialog"
          aria-label="Close context and continue"
          title="Close and continue"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="dialog-content">
        <h2 class="dialog-name" id="dialog-name"></h2>

        <div class="dialog-body" id="dialog-body"></div>

        <section class="dialog-sources" id="dialog-sources" hidden aria-label="Reporting sources">
          <h3 class="dialog-sources__heading">Documented Sources</h3>
          <ul class="dialog-sources__list" id="dialog-sources-list"></ul>
        </section>
      </div>

      <div class="dialog-footer">
        <button type="button" id="dialog-continue" class="continue-btn">
          <span>Close &amp; Continue</span>
        </button>
      </div>
    </article>
  </dialog>

  <script src="script.js" defer></script>
</body>
</html>
